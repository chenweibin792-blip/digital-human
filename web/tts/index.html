<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EdgeTTS 语音管理 - LiveTalking</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css">
    <style>
        :root { --primary:#4361ee; --secondary:#3f37c9; --ink:#1e293b; --muted:#64748b; }
        body { min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#e0eafc,#cfdef3); }
        .navbar { background:linear-gradient(135deg,var(--primary),var(--secondary)); box-shadow:0 2px 10px #0002; }
        .glass-card { background:#ffffffe6; border:1px solid #fff8; border-radius:16px; box-shadow:0 10px 30px -10px #0f172a22; }
        .card-title { font-size:1rem; font-weight:700; }
        .form-label { color:var(--muted); font-size:.88rem; font-weight:600; }
        .btn-edge { color:#fff; border:0; background:linear-gradient(135deg,var(--primary),var(--secondary)); }
        .btn-edge:hover { color:#fff; filter:brightness(1.05); }
        .status-dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:#ef4444; }
        .status-dot.on { background:#34d399; box-shadow:0 0 0 4px #34d39933; }
        .voice-list { max-height:480px; overflow:auto; }
        .voice-row { cursor:pointer; border:1px solid transparent; border-radius:10px; }
        .voice-row:hover, .voice-row.active { background:#eef2ff; border-color:#c7d2fe; }
        .hint { color:#94a3b8; font-size:.78rem; }
        #message { min-height:24px; }
        audio { width:100%; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container py-2">
        <span class="navbar-brand mb-0"><i class="bi bi-soundwave me-2"></i>EdgeTTS 语音管理</span>
        <div class="d-flex align-items-center gap-3 text-white-50 small">
            <span><span id="statusDot" class="status-dot me-2"></span><span id="statusText">未连接</span></span>
            <a class="text-white-50 text-decoration-none" href="/tts/index-en.html">English</a>
            <a class="text-white-50 text-decoration-none" href="/index.html"><i class="bi bi-house"></i> 主页</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="glass-card p-3 p-md-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-8">
                <label class="form-label" for="serverUrl">服务地址</label>
                <input id="serverUrl" class="form-control" readonly>
                <div class="hint mt-1">使用当前 LiveTalking 服务，不依赖额外的 TTS 服务器。</div>
            </div>
            <div class="col-md-4 d-grid">
                <button id="connectButton" class="btn btn-edge" type="button"><i class="bi bi-arrow-clockwise me-1"></i>刷新语音列表</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <section class="col-lg-7">
            <div class="glass-card p-3 p-md-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="card-title mb-0"><i class="bi bi-people-fill text-primary me-2"></i>可用语音</h1>
                    <span id="voiceCount" class="badge text-bg-light">0 个</span>
                </div>
                <input id="voiceSearch" class="form-control form-control-sm mb-3" placeholder="搜索名称或地区">
                <div id="voiceList" class="voice-list">
                    <div class="text-center text-muted py-5">正在读取 EdgeTTS 语音列表…</div>
                </div>
            </div>
        </section>

        <section class="col-lg-5">
            <div class="glass-card p-3 p-md-4">
                <h2 class="card-title mb-3"><i class="bi bi-chat-text-fill text-primary me-2"></i>合成试听</h2>
                <div class="mb-3">
                    <label class="form-label" for="voice">语音</label>
                    <select id="voice" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="text">文本</label>
                    <textarea id="text" class="form-control" rows="5" maxlength="20000">你好，欢迎使用 LiveTalking 数字人系统。今天是一个适合创造的好日子！</textarea>
                    <div class="hint mt-1">超长文本会按标点安全分段；最多 20,000 个字符。</div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-4">
                        <label class="form-label" for="rate">语速</label>
                        <input id="rate" class="form-control form-control-sm" value="+0%">
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="volume">音量</label>
                        <input id="volume" class="form-control form-control-sm" value="+0%">
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="pitch">音调</label>
                        <input id="pitch" class="form-control form-control-sm" value="+0Hz">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button id="synthesizeButton" class="btn btn-edge flex-grow-1" type="button"><i class="bi bi-play-fill me-1"></i>合成 WAV</button>
                    <button id="saveButton" class="btn btn-outline-primary" type="button" title="保存为运行时默认配置">保存</button>
                </div>
                <div id="message" class="small mt-3" role="status" aria-live="polite"></div>
                <div id="preview" class="mt-3 d-none">
                    <audio id="audio" controls></audio>
                    <a id="download" class="btn btn-sm btn-outline-primary mt-2" download="edge-preview.wav"><i class="bi bi-download me-1"></i>下载 WAV</a>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
const state = { voices: [], objectUrl: null };
const $ = id => document.getElementById(id);

function setMessage(text, kind = 'muted') {
    $('message').className = `small mt-3 text-${kind}`;
    $('message').textContent = text;
}

function setConnected(connected) {
    $('statusDot').classList.toggle('on', connected);
    $('statusText').textContent = connected ? '已连接' : '未连接';
}

function renderVoices() {
    const query = $('voiceSearch').value.trim().toLowerCase();
    const visible = state.voices.filter(item =>
        `${item.ShortName} ${item.Locale} ${item.FriendlyName}`.toLowerCase().includes(query)
    );
    $('voiceCount').textContent = `${visible.length} 个`;
    $('voiceList').replaceChildren(...visible.map(item => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = `voice-row btn text-start w-100 p-2 mb-1 ${$('voice').value === item.ShortName ? 'active' : ''}`;
        const title = document.createElement('strong');
        title.textContent = item.ShortName;
        const detail = document.createElement('div');
        detail.className = 'hint';
        detail.textContent = `${item.Locale} · ${item.Gender || 'Unknown'} · ${item.FriendlyName || ''}`;
        row.append(title, detail);
        row.addEventListener('click', () => {
            $('voice').value = item.ShortName;
            renderVoices();
        });
        return row;
    }));
}

async function loadConfig() {
    const response = await fetch('/api/tts/config');
    if (!response.ok) throw new Error('无法读取 EdgeTTS 配置');
    const config = await response.json();
    $('voice').dataset.default = config.voice;
    $('rate').value = config.rate;
    $('volume').value = config.volume;
    $('pitch').value = config.pitch;
}

async function loadVoices() {
    $('connectButton').disabled = true;
    setMessage('正在获取语音列表…');
    try {
        const response = await fetch('/api/tts/voices');
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || '获取语音列表失败');
        state.voices = data.voices;
        $('voice').replaceChildren(...state.voices.map(item => {
            const option = document.createElement('option');
            option.value = item.ShortName;
            option.textContent = `${item.ShortName} (${item.Locale})`;
            return option;
        }));
        const preferred = $('voice').dataset.default || 'zh-CN-XiaoxiaoNeural';
        if (state.voices.some(item => item.ShortName === preferred)) $('voice').value = preferred;
        renderVoices();
        setConnected(true);
        setMessage(`已读取 ${state.voices.length} 个 EdgeTTS 语音。`, 'success');
    } catch (error) {
        setConnected(false);
        $('voiceList').textContent = error.message;
        setMessage(error.message, 'danger');
    } finally {
        $('connectButton').disabled = false;
    }
}

async function saveConfig() {
    const response = await fetch('/api/tts/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({voice:$('voice').value, rate:$('rate').value, volume:$('volume').value, pitch:$('pitch').value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || '保存配置失败');
    setMessage('运行时默认配置已更新。', 'success');
}

async function synthesize() {
    $('synthesizeButton').disabled = true;
    setMessage('正在合成，请稍候…');
    try {
        const response = await fetch('/v1/audio/speech', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                input:$('text').value, voice:$('voice').value, response_format:'wav',
                rate:$('rate').value, volume:$('volume').value, pitch:$('pitch').value
            })
        });
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.message || '语音合成失败');
        }
        const blob = await response.blob();
        if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
        state.objectUrl = URL.createObjectURL(blob);
        $('audio').src = state.objectUrl;
        $('download').href = state.objectUrl;
        $('preview').classList.remove('d-none');
        setMessage(`合成成功，WAV 大小 ${(blob.size / 1024).toFixed(1)} KB。`, 'success');
    } catch (error) {
        setMessage(error.message, 'danger');
    } finally {
        $('synthesizeButton').disabled = false;
    }
}

$('serverUrl').value = window.location.origin;
$('voiceSearch').addEventListener('input', renderVoices);
$('voice').addEventListener('change', renderVoices);
$('connectButton').addEventListener('click', loadVoices);
$('saveButton').addEventListener('click', () => saveConfig().catch(error => setMessage(error.message, 'danger')));
$('synthesizeButton').addEventListener('click', synthesize);
window.addEventListener('beforeunload', () => state.objectUrl && URL.revokeObjectURL(state.objectUrl));

(async () => {
    try {
        await loadConfig();
        await loadVoices();
    } catch (error) {
        setConnected(false);
        setMessage(error.message, 'danger');
    }
})();
</script>
</body>
</html>
