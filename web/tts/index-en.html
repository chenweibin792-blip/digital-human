<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EdgeTTS Voice Manager - LiveTalking</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css">
    <style>
        :root { --primary:#4361ee; --secondary:#3f37c9; --ink:#1e293b; --muted:#64748b; }
        body { min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#e0eafc,#cfdef3); }
        .navbar { background:linear-gradient(135deg,var(--primary),var(--secondary)); box-shadow:0 2px 10px #0002; }
        .glass-card { background:#ffffffe6; border:1px solid #fff8; border-radius:16px; box-shadow:0 10px 30px -10px #0f172a22; }
        .card-title { font-size:1rem; font-weight:700; }
        .form-label { color:var(--muted); font-size:.88rem; font-weight:600; }
        .btn-edge { color:#fff; border:0; background:linear-gradient(135deg,var(--primary),var(--secondary)); }
        .btn-edge:hover { color:#fff; filter:brightness(1.05); }
        .status-dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:#ef4444; }
        .status-dot.on { background:#34d399; box-shadow:0 0 0 4px #34d39933; }
        .voice-list { max-height:480px; overflow:auto; }
        .voice-row { cursor:pointer; border:1px solid transparent; border-radius:10px; }
        .voice-row:hover, .voice-row.active { background:#eef2ff; border-color:#c7d2fe; }
        .hint { color:#94a3b8; font-size:.78rem; }
        #message { min-height:24px; }
        audio { width:100%; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container py-2">
        <span class="navbar-brand mb-0"><i class="bi bi-soundwave me-2"></i>EdgeTTS Voice Manager</span>
        <div class="d-flex align-items-center gap-3 text-white-50 small">
            <span><span id="statusDot" class="status-dot me-2"></span><span id="statusText">Disconnected</span></span>
            <a class="text-white-50 text-decoration-none" href="/tts/index.html">中文</a>
            <a class="text-white-50 text-decoration-none" href="/index-en.html"><i class="bi bi-house"></i> Home</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="glass-card p-3 p-md-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-8">
                <label class="form-label" for="serverUrl">Server address</label>
                <input id="serverUrl" class="form-control" readonly>
                <div class="hint mt-1">Uses the current LiveTalking service; no separate TTS server is required.</div>
            </div>
            <div class="col-md-4 d-grid">
                <button id="connectButton" class="btn btn-edge" type="button"><i class="bi bi-arrow-clockwise me-1"></i>Refresh voices</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <section class="col-lg-7">
            <div class="glass-card p-3 p-md-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="card-title mb-0"><i class="bi bi-people-fill text-primary me-2"></i>Available voices</h1>
                    <span id="voiceCount" class="badge text-bg-light">0</span>
                </div>
                <input id="voiceSearch" class="form-control form-control-sm mb-3" placeholder="Search name or locale">
                <div id="voiceList" class="voice-list"><div class="text-center text-muted py-5">Loading EdgeTTS voices…</div></div>
            </div>
        </section>

        <section class="col-lg-5">
            <div class="glass-card p-3 p-md-4">
                <h2 class="card-title mb-3"><i class="bi bi-chat-text-fill text-primary me-2"></i>Synthesis preview</h2>
                <div class="mb-3">
                    <label class="form-label" for="voice">Voice</label>
                    <select id="voice" class="form-select"></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="text">Text</label>
                    <textarea id="text" class="form-control" rows="5" maxlength="20000">Hello! LiveTalking can now synthesize natural Chinese and English speech with EdgeTTS.</textarea>
                    <div class="hint mt-1">Long text is split safely at punctuation; maximum 20,000 characters.</div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-4"><label class="form-label" for="rate">Rate</label><input id="rate" class="form-control form-control-sm" value="+0%"></div>
                    <div class="col-4"><label class="form-label" for="volume">Volume</label><input id="volume" class="form-control form-control-sm" value="+0%"></div>
                    <div class="col-4"><label class="form-label" for="pitch">Pitch</label><input id="pitch" class="form-control form-control-sm" value="+0Hz"></div>
                </div>
                <div class="d-flex gap-2">
                    <button id="synthesizeButton" class="btn btn-edge flex-grow-1" type="button"><i class="bi bi-play-fill me-1"></i>Synthesize WAV</button>
                    <button id="saveButton" class="btn btn-outline-primary" type="button">Save</button>
                </div>
                <div id="message" class="small mt-3" role="status" aria-live="polite"></div>
                <div id="preview" class="mt-3 d-none">
                    <audio id="audio" controls></audio>
                    <a id="download" class="btn btn-sm btn-outline-primary mt-2" download="edge-preview.wav"><i class="bi bi-download me-1"></i>Download WAV</a>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
const state = { voices: [], objectUrl: null };
const $ = id => document.getElementById(id);
function message(text, kind='muted') { $('message').className=`small mt-3 text-${kind}`; $('message').textContent=text; }
function connected(value) { $('statusDot').classList.toggle('on',value); $('statusText').textContent=value?'Connected':'Disconnected'; }
function render() {
    const query=$('voiceSearch').value.trim().toLowerCase();
    const voices=state.voices.filter(v=>`${v.ShortName} ${v.Locale} ${v.FriendlyName}`.toLowerCase().includes(query));
    $('voiceCount').textContent=String(voices.length);
    $('voiceList').replaceChildren(...voices.map(v=>{
        const row=document.createElement('button'); row.type='button';
        row.className=`voice-row btn text-start w-100 p-2 mb-1 ${$('voice').value===v.ShortName?'active':''}`;
        const title=document.createElement('strong'); title.textContent=v.ShortName;
        const detail=document.createElement('div'); detail.className='hint'; detail.textContent=`${v.Locale} · ${v.Gender||'Unknown'} · ${v.FriendlyName||''}`;
        row.append(title,detail); row.onclick=()=>{$('voice').value=v.ShortName;render();}; return row;
    }));
}
async function load() {
    $('connectButton').disabled=true; message('Loading voices…');
    try {
        const [configResponse,voicesResponse]=await Promise.all([fetch('/api/tts/config'),fetch('/api/tts/voices')]);
        const config=await configResponse.json(), data=await voicesResponse.json();
        if(!configResponse.ok||!voicesResponse.ok) throw new Error(data.message||'Unable to load EdgeTTS');
        state.voices=data.voices; $('rate').value=config.rate; $('volume').value=config.volume; $('pitch').value=config.pitch;
        $('voice').replaceChildren(...state.voices.map(v=>{const option=document.createElement('option');option.value=v.ShortName;option.textContent=`${v.ShortName} (${v.Locale})`;return option;}));
        if(state.voices.some(v=>v.ShortName===config.voice)) $('voice').value=config.voice;
        render(); connected(true); message(`Loaded ${state.voices.length} EdgeTTS voices.`,'success');
    } catch(error) { connected(false); message(error.message,'danger'); }
    finally { $('connectButton').disabled=false; }
}
async function save() {
    const response=await fetch('/api/tts/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voice:$('voice').value,rate:$('rate').value,volume:$('volume').value,pitch:$('pitch').value})});
    const data=await response.json(); if(!response.ok) throw new Error(data.message||'Unable to save configuration'); message('Runtime defaults updated.','success');
}
async function synthesize() {
    $('synthesizeButton').disabled=true; message('Synthesizing…');
    try {
        const response=await fetch('/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:$('text').value,voice:$('voice').value,response_format:'wav',rate:$('rate').value,volume:$('volume').value,pitch:$('pitch').value})});
        if(!response.ok){const data=await response.json();throw new Error(data.message||'Synthesis failed');}
        const blob=await response.blob(); if(state.objectUrl)URL.revokeObjectURL(state.objectUrl); state.objectUrl=URL.createObjectURL(blob);
        $('audio').src=state.objectUrl;$('download').href=state.objectUrl;$('preview').classList.remove('d-none');message(`Success: ${(blob.size/1024).toFixed(1)} KB WAV.`,'success');
    } catch(error){message(error.message,'danger');} finally{$('synthesizeButton').disabled=false;}
}
$('serverUrl').value=location.origin;$('voiceSearch').oninput=render;$('voice').onchange=render;$('connectButton').onclick=load;
$('saveButton').onclick=()=>save().catch(error=>message(error.message,'danger'));$('synthesizeButton').onclick=synthesize;
addEventListener('beforeunload',()=>state.objectUrl&&URL.revokeObjectURL(state.objectUrl));load();
</script>
</body>
</html>
